[package]
name = "slint-kit"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Shared Slint Theme global + LMTT Material You token bridge"
repository = "https://github.com/MasonRhodesDev/slint-kit"
readme = "README.md"

[dependencies]
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2"] }
lmtt-core = { git = "https://github.com/MasonRhodesDev/linux-multi-theme-toggle", rev = "7e0bb1705d16a3a8d37a795fc3d324dae47fbda9" }
notify = { version = "6", optional = true }
parking_lot = { version = "0.12", optional = true }
zbus = { version = "4.4", default-features = false, features = ["async-io"], optional = true }

[features]
default = ["watch"]
watch = ["dep:notify", "dep:parking_lot", "dep:zbus"]

[dev-dependencies]
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2"] }

[workspace]
members = [".", "examples/gallery"]
resolver = "2"
